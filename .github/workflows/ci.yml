name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask Werkzeug rns lxmf lxst numpy psutil

      - name: Compile Python modules
        run: |
          python -m py_compile \
            manager/rns_manager.py \
            manager/modules/rns_monitor.py \
            messenger/lxmf_chat.py \
            messenger/messenger.py \
            messenger/telemetry_provider.py \
            messenger/audio_codec.py \
            messenger/core/telemeter.py \
            sideband_plugins/rangetest.py

      - name: Validate inline JavaScript
        run: python tools/check_inline_js.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
